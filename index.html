/* ---------------------------------------------------------
   window.storage — implementado con localStorage para que
   la app funcione de forma standalone en GitHub Pages, sin
   depender del backend de Claude.ai. Misma forma de API que
   usa el resto del código, así que no hay que tocar nada más.
--------------------------------------------------------- */
window.storage = (function () {
    function fullKey(key, shared) {
        return "gym-sessions:" + (shared ? "shared:" : "user:") + key;
    }
    return {
        get: async function (key, shared) {
            const raw = localStorage.getItem(fullKey(key, shared));
            if (raw === null)
                throw new Error("key not found");
            return { key: key, value: raw, shared: !!shared };
        },
        set: async function (key, value, shared) {
            localStorage.setItem(fullKey(key, shared), value);
            return { key: key, value: value, shared: !!shared };
        },
        delete: async function (key, shared) {
            localStorage.removeItem(fullKey(key, shared));
            return { key: key, deleted: true, shared: !!shared };
        },
        list: async function (prefix, shared) {
            const pre = fullKey(prefix || "", shared);
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.indexOf(pre) === 0)
                    keys.push(k.slice(("gym-sessions:" + (shared ? "shared:" : "user:")).length));
            }
            return { keys: keys, prefix: prefix, shared: !!shared };
        },
    };
})();

/* ---------------------------------------------------------
   TIMER RING
--------------------------------------------------------- */
function TimerRing({ progress, phase, seconds, size = 260, scale = 1 }) {
    const stroke = 14;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const offset = c * (1 - progress);
    const ringColor = phase === "rest" ? "#FFB020" : "#5B8CFF";
    return (React.createElement("div", { style: { position: "relative", width: size, height: size } },
        React.createElement("svg", { width: size, height: size, style: { transform: "rotate(-90deg)" } },
            React.createElement("circle", { cx: size / 2, cy: size / 2, r: r, stroke: "#232C47", strokeWidth: stroke, fill: "none" }),
            React.createElement("circle", { cx: size / 2, cy: size / 2, r: r, stroke: ringColor, strokeWidth: stroke, fill: "none", strokeLinecap: "round", strokeDasharray: c, strokeDashoffset: offset, style: { transition: "stroke-dashoffset 0.3s linear, stroke 0.3s" } })),
        React.createElement("div", { style: {
                position: "absolute",
                inset: 0,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
            } },
            React.createElement("span", { style: {
                    fontFamily: "'Orbitron', sans-serif",
                    fontWeight: 800,
                    fontSize: `${5.1 * scale}rem`,
                    lineHeight: 1,
                    color: "#EDF1F9",
                    letterSpacing: "1px",
                    fontVariantNumeric: "tabular-nums",
                } }, seconds),
            React.createElement("span", { style: {
                    fontFamily: "'Inter', sans-serif",
                    fontSize: `${0.85 * scale}rem`,
                    fontWeight: 700,
                    letterSpacing: "3px",
                    color: ringColor,
                    marginTop: "4px",
                } }, phase === "rest" ? "DESCANSO" : "TRABAJO"))));
}
/* ---------------------------------------------------------
   STEP QUEUE BUILDER
--------------------------------------------------------- */
function buildSteps(exercises) {
    const steps = [];
    for (let setIdx = 0; setIdx < SETS_PER_EXERCISE; setIdx++) {
        exercises.forEach((_, exIdx) => {
            steps.push({ type: "work", exIdx, setIdx, duration: WORK_SECONDS });
            const isVeryLast = setIdx === SETS_PER_EXERCISE - 1 && exIdx === exercises.length - 1;
            if (!isVeryLast) {
                steps.push({ type: "rest", exIdx, setIdx, duration: REST_SECONDS });
            }
        });
    }
    return steps;
}
/* ---------------------------------------------------------
   AUDIO CUES (sin assets externos)
--------------------------------------------------------- */
function useBeeper() {
    const ctxRef = useRef(null);
    const ensure = useCallback(() => {
        if (!ctxRef.current) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC)
                ctxRef.current = new AC();
        }
        if (ctxRef.current && ctxRef.current.state === "suspended")
            ctxRef.current.resume();
    }, []);
    const beep = useCallback((freq = 880, dur = 0.12, vol = 0.16) => {
        const ctx = ctxRef.current;
        if (!ctx)
            return;
        try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            osc.type = "sine";
            osc.connect(gain);
            gain.connect(ctx.destination);
            gain.gain.setValueAtTime(vol, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
            osc.start();
            osc.stop(ctx.currentTime + dur);
        }
        catch (e) {
            /* noop */
        }
    }, []);
    return { ensure, beep };
}
